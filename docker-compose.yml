services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: soilflo
      POSTGRES_PASSWORD: soilflo
      POSTGRES_DB: soilflo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soilflo']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    # Redis is used by BullMQ in the production queue path (QUEUE_ENABLED=true)

volumes:
  postgres_data:
